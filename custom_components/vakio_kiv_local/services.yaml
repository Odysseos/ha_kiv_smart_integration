get_yaha_config:
  name: Получить конфигурацию YaHA
  description: Возвращает настройки с фактическими entity ID; не изменяет конфигурацию YaHA.
  fields:
    device_id:
      name: Прибор
      required: true
      selector:
        device:
          integration: vakio_kiv_local

export_yaha_config:
  name: Сохранить конфигурацию всех клапанов для YaHA
  description: >-
    Создаёт или обновляет includes/yandex_smart_home_vakio.yaml
    для всех добавленных клапанов. Остальные файлы не изменяет.
    После выполнения примените настройки YaHA. Доступно администратору.

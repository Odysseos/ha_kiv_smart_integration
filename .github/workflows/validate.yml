name: Validate manual setup and integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install native test dependency
        run: sudo apt-get update && sudo apt-get install -y libturbojpeg

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check out the tested YaHA revision
        uses: actions/checkout@v5
        with:
          repository: dext0r/yandex_smart_home
          ref: 7d1121923c91fdd190f3d13d75be8896aed18735
          path: .deps/yaha

      - name: Validate HA behavior
        run: python tests/validate_ha.py

      - name: Validate YaHA behavior and filters
        env:
          PYTHONPATH: ${{ github.workspace }}/.deps/yaha
        run: python tests/validate_yaha.py

      - name: Check Home Assistant configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/.deps/yaha
        run: python tests/validate_config.py
      - name: Validate native integration, config flow and YaHA
        env:
          PYTHONPATH: ${{ github.workspace }}/.deps/yaha
        run: python tests/validate_integration.py

      - name: Validate Overview browser module
        run: node tests/validate_frontend.mjs

      - name: Validate HA module registration and HTTP route
        run: python tests/validate_frontend.py

      - name: Validate standalone device settings server
        run: python tests/validate_device_settings.py

      - name: Validate repository structure and documentation
        run: python tests/validate_project.py
